<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>귀여운 굿즈 뽑기 (텍스트 카드 버전)</title>

    <style>
        body {
            font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background: #ffeef8;
            margin: 0;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 40px;
            font-size: 36px;
            color: #ff82b2;
            text-shadow: 1px 1px 0 white;
        }

        .container {
            margin-top: 40px;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff3fc;
            border: 2px solid #ffc4e2;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .settings-btn:hover {
            transform: scale(1.1);
            background: #ffe0f3;
        }

        .settings-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 260px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #ffc4e2;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .draw-btn {
            font-size: 26px;
            padding: 20px 60px;
            background: #ff9bcd;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #e36ba3;
            transition: 0.2s;
        }

        .spin { animation: spinAnim 0.6s ease; }

        @keyframes spinAnim {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(360deg) scale(1.1); }
            100% { transform: rotate(720deg) scale(1); }
        }

        .flip-card {
            width: 260px;
            height: 300px;
            margin: 40px auto;
            perspective: 1000px;
        }

        .flip-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .flip-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .card-back {
            background: linear-gradient(135deg, #ffc8e8, #ffe6f3);
            color: white;
            font-size: 34px;
        }

        .card-front {
            background: #ffffff;
            transform: rotateY(180deg);
            color: #ff6fa8;
            padding: 20px;
            text-align: center;
            font-size: 30px;
            line-height: 1.3;
        }

        .flipped { transform: rotateY(180deg); }

        .reset-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #ff6b81;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .reset-btn:hover { background: #ff526c; }

        .particle {
            position: fixed;
            font-size: 20px;
            animation: particleMove 1.2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes particleMove {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.6); }
        }

        #stockPanel {
            margin: 40px auto;
            width: 340px;
            background: #ffffff;
            border-radius: 16px;
            padding: 15px 20px;
            border: 2px solid #ffc4e2;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            text-align: left;
            font-size: 18px;
            color: #ff7abf;
        }

        #stockPanel h3 {
            margin: 0 0 10px;
            color: #ff489e;
            font-size: 22px;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }
    </style>
</head>

<body>

<h1>🐰 컬러팅 굿즈 뽑기 😻</h1>

<div class="container">

    <button id="settingsBtn" class="settings-btn">⚙️</button>

    <div id="settingsPanel" class="settings-panel hidden">
        <h3>설정</h3>
        <div id="stockSettings"></div>
        <button id="resetBtn" class="reset-btn">🔄 재고 리셋</button>
    </div>

    <button id="drawBtn" class="draw-btn">🎁 뽑기!</button>

    <div id="result"></div>

    <div id="stockPanel">
        <h3>📦 남은 수량</h3>
        <div id="stockList"></div>
    </div>

</div>

<script>
    let initialStock = {
        "캐치 코롯토": 6,
        "라비 코롯토": 10,
        "캔뱃지": 20,
        "포토카드": 52,
        "판스티커": 21
    };

    let goodsStock = { ...initialStock };

    const drawBtn = document.getElementById("drawBtn");
    const result = document.getElementById("result");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const stockSettings = document.getElementById("stockSettings");
    const resetBtn = document.getElementById("resetBtn");
    const stockList = document.getElementById("stockList");

    function refreshStockPanel() {
        stockList.innerHTML = "";

        Object.keys(goodsStock).forEach(name => {
            const remaining = goodsStock[name];
            const total = initialStock[name];

            const div = document.createElement("div");
            div.className = "stock-item";
            div.innerHTML = `<span>${name}</span><span>${remaining} / ${total}</span>`;
            stockList.appendChild(div);
        });
    }

    refreshStockPanel();

    settingsBtn.addEventListener("click", () => {
        settingsPanel.classList.toggle("hidden");
        renderStockSettings();
    });

    function renderStockSettings() {
        stockSettings.innerHTML = "";
        Object.keys(goodsStock).forEach(name => {
            let div = document.createElement("div");
            div.style.marginBottom = "8px";

            div.innerHTML = `
      <label>${name} : </label>
      <input type="number" id="stock-${name}" value="${goodsStock[name]}" min="0" style="width:60px;">
    `;
            stockSettings.appendChild(div);
        });
    }

    drawBtn.addEventListener("click", () => {
        drawBtn.classList.add("spin");
        setTimeout(() => drawBtn.classList.remove("spin"), 600);

        const available = Object.keys(goodsStock).filter(n => goodsStock[n] > 0);
        if (available.length === 0) {
            result.innerHTML = "<p style='color:#ff5e7d;font-size:22px;'>재고 소진!</p>";
            return;
        }

        const selected = available[Math.floor(Math.random() * available.length)];
        goodsStock[selected]--;

        refreshStockPanel();
        showFlipCard(selected);
        spawnParticles(20);
    });

    function showFlipCard(name) {
        result.innerHTML = `
    <div class="flip-card">
      <div class="flip-inner" id="flipInner">
        <div class="flip-face card-back">🐿️</div>
        <div class="flip-face card-front">${name}</div>
      </div>
    </div>
  `;
        setTimeout(() => {
            document.getElementById("flipInner").classList.add("flipped");
        }, 50);
    }

    function spawnParticles(count) {
        const shapes = ["✨", "💖", "⭐"];
        for (let i = 0; i < count; i++) {
            const p = document.createElement("div");
            p.className = "particle";
            p.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];

            p.style.left = (window.innerWidth / 2 + (Math.random() * 200 - 100)) + "px";
            p.style.top = (window.innerHeight / 2 + 50) + "px";
            p.style.animationDuration = (0.8 + Math.random() * 0.6) + "s";

            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1500);
        }
    }

    stockSettings.addEventListener("change", () => {
        Object.keys(goodsStock).forEach(name => {
            const input = document.getElementById(`stock-${name}`);
            goodsStock[name] = Number(input.value);
        });
        refreshStockPanel();
    });

    resetBtn.addEventListener("click", () => {
        goodsStock = { ...initialStock };
        refreshStockPanel();
        renderStockSettings();
        result.innerHTML = "<p style='color:#ff7abf;'>재고가 초기화되었습니다!</p>";
    });
</script>

</body>
</html>
